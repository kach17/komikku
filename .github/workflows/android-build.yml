# .github/workflows/android-build.yml

name: Android Build

# This workflow will run on every push to any branch.
on:
  push:
    branches: [ "**" ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

jobs:
  build:
    # Use a standard Ubuntu virtual machine provided by GitHub.
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repository's code so the job can access it.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up the correct Java version (JDK 17) required by Komikku.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Caches Gradle dependencies to speed up future builds

      # 3. Grant execute permission to the Gradle wrapper script. This is a crucial step.
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Run the Gradle build command. This is the same command I was failing to run locally.
      #    The GitHub environment has the Android SDK pre-installed and configured.
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. Upload the generated APK file as a "build artifact".
      #    This allows you to download the APK directly from the GitHub Actions run page.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
